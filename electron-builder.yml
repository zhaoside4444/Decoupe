appId: com.decoupe.app
productName: Decoupe
directories:
  output: release
  buildResources: build
files:
  - out/**
  - build/icon.png
  - package.json
asar: true
disableAsarIntegrity: true
win:
  icon: build/icon.ico
  signExecutable: false
  target:
    - zip
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Decoupe
  installerIcon: build/icon.ico
  uninstallDisplayName: Decoupe ${version}
mac:
  icon: build/icon.png
  target:
    - dmg
  category: public.app-category.productivity
linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Utility
