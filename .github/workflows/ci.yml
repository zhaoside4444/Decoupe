name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Vérification
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run typecheck

      - name: Lancer les tests
        run: npm test

      - name: Compiler
        run: npm run build

  package-windows:
    name: Paquet Windows
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l'installateur et l'archive
        run: npm run dist -- --publish never

      - name: Publier les artefacts
        uses: actions/upload-artifact@v4
        with:
          name: decoupe-windows-${{ github.ref_name }}
          path: |
            release/*.exe
            release/*.zip
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30
